[modules.dang]
source = ".dagger/modules/dang"
entrypoint = true

[modules.dang-sdk]
source = "dagger.io/sdk/dang"

[modules.go]
source = "dagger.io/go"

[modules.editor]
source = "github.com/vito/editor"

[sdks.dang]
module = "dang-sdk"

[sdks.dang.scopes.".dagger/modules/dang"]
is-module = true
clients = ["./mod/apko"]

[sdks.dang.scopes."mod/apko"]
is-module = true

[modules.go.settings]
base = "dang:base"
# Runtime-loaded fixtures, editor plugins, and tree-sitter inputs are not Go files.
includeExtraFiles = ["tests/**", "editors/**", "treesitter/**", "pkg/dang/*.peg"]
# Zed downloads its own grammar checkout here; it is not a project module.
lint = ["!editors/zed/grammars"]
test = ["!editors/zed/grammars"]
generate = ["!editors/zed/grammars"]

[modules.committer]
source = "github.com/vito/agents/committer"

[modules.contributor]
source = "github.com/vito/agents/contributor"
settings.githubToken = "cmd://gh auth token"

[modules.staff]
source = "github.com/vito/agents/staff"

schema:
  - schema.graphqls

exec:
  package: gqlserver
  layout: single-file
  filename: generated.go

model:
  filename: models_gen.go
  package: gqlserver

resolver:
  package: gqlserver
  # Keep the stateful Resolver in data.go; single-file recreates an empty one.
  layout: follow-schema
  dir: .
  filename: data.go
  filename_template: resolvers.go

directives:
  expectedType:
    skip_runtime: true

models:
  Opaque:
    model: github.com/99designs/gqlgen/graphql.Any
